name: "✨ Feature Request"
description: Propose a new feature, connector, or CUA capability
title: "[FEATURE]: "
labels: ["enhancement", "proposal"]
body:
  - type: markdown
    attributes:
      value: Share your ideas for new Muse features or AI agent workflows!
  - type: textarea
    id: problem
    attributes:
      label: What problem would this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how you envision this working.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions Considered
