name: "🐛 Bug Report"
description: File a bug report to help improve Muse Agent
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting an issue! Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Run 'muse run'
        2. Enter prompt '...'
        3. See error
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11 / 10
        - Ubuntu / Debian Linux
        - macOS (Apple Silicon / Intel)
        - Docker Container
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output / Traceback
      render: shell
