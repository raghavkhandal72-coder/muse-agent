name: Muse AI Agent CI & Security Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Compile & Verify Python Engine Syntax
      run: |
        python -m py_compile assets/engine/*.py || python -m py_compile *.py

    - name: Scan for Accidental Hardcoded API Keys
      run: |
        if grep -rnE "(nvapi-[a-zA-Z0-9_-]{20,}|AQ\.Ab8R|6d7946957364b8de4a738f8efcf2a436)" . --exclude-dir=.git; then
          echo "ERROR: Hardcoded API key detected!"
          exit 1
        fi
        echo "Security scan passed: 0 hardcoded keys found."
