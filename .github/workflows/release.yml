name: Release Muse Agent

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: "Muse AI Agent Release ${{ github.ref_name }}"
        draft: false
        prerelease: false
        generate_release_notes: true
